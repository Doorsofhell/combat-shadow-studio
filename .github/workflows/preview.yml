
name: Combat Shadow Studio - Preview

on:
  push:
    branches:
      - feature/coachs-champions
      - feature/combat-shadow-v025
      - feature/combat-shadow-v029
      - feature/combat-shadow-v030
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # v0.37 comptes : configuration web publique du projet Firebase « Combat Shadow Studio » (forfait Spark).
          # Ce sont des identifiants publics (présents dans toute application web Firebase), pas des secrets :
          # l'accès est protégé par Firebase Authentication et les règles Firestore (firestore.rules).
          VITE_FIREBASE_API_KEY: AIzaSyDBWzZTC4QHV445rRtbrJ-fLJLfUWCujV8
          VITE_FIREBASE_AUTH_DOMAIN: combat-shadow-studio.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: combat-shadow-studio
          VITE_FIREBASE_APP_ID: 1:48532638871:web:2f135f723753e52b2cedd2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
