name: v1.51.0 - Kadir Nael Inaya WebGL before-after

on:
  pull_request:
    branches:
      - claude/project-thread-o7lrt8
    paths-ignore:
      - 'captures/v1510/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webgl-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated v1.51.0 pilot
        uses: actions/checkout@v4
        with:
          ref: feature/fighter-visual-v1510
          persist-credentials: true
      - name: Checkout exact v1.50.0 stable version
        uses: actions/checkout@v4
        with:
          ref: 7068f78803630bfa7967083fcf3bf63e3a72e5b6
          path: reference-v1500
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix reference-v1500
      - name: Unit regression tests
        run: npm run test -- src/three/__tests__/fighter-visual-v1510.test.ts src/three/__tests__/premium-skin-v1480.test.ts src/domain/release-version.test.ts
      - name: Build without publishing
        run: npm run build
      - name: Setup headless WebGL
        run: npx playwright install --with-deps chromium
      - name: Generate 18 real before-and-after coach images
        run: node scripts/visuels/v1510-before-after.mjs
      - name: Upload comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1510-real-coach-before-after
          path: captures/v1510/
          if-no-files-found: warn
      - name: Commit direct PNG image links to prototype branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/v1510/
          if ! git diff --cached --quiet; then
            git commit -m "test(1.51): matched real coach PNG comparisons [skip ci]"
            git push origin HEAD:feature/fighter-visual-v1510
          fi
