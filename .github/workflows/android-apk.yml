# Test APK (debug-signed) for installing on a real phone. Never a Play Store build: the release
# AAB needs the private upload key, which stays off GitHub (docs/ANDROID.md).
name: APK de test Android

on:
  workflow_dispatch:
  push:
    branches: ['build/apk']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - name: APK de test
        run: npm run build:android && cd android && ./gradlew assembleDebug --stacktrace
      - name: Nom versionné
        id: name
        run: |
          V=$(node -p "require('./package.json').version")
          echo "file=combat-shadow-studio-v$V-test.apk" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "combat-shadow-studio-v$V-test.apk"
          sha256sum "combat-shadow-studio-v$V-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
      # the APK is also kept on its own branch so it can be fetched with plain git
      - name: Branche apk-builds
        run: |
          F=${{ steps.name.outputs.file }}
          mkdir /tmp/out && cp "$F" /tmp/out/ && cd /tmp/out
          git init -q -b apk-builds
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add "$F"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "APK de test $F (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
      # versioned pre-release on GitHub with the APK attached (test build, not the Play Store one)
      - name: Pré-version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=${{ steps.name.outputs.file }}
          V=$(node -p "require('./package.json').version")
          NOTES="APK de test Android de Combat Shadow Studio v$V, signé avec une clé de debug (installation manuelle, pas pour le Play Store). Pour installer une version suivante, désinstalle d'abord celle-ci. Commit ${GITHUB_SHA::7}."
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$F" --clobber
          else
            gh release create "v$V" "$F" --target "$GITHUB_SHA" --prerelease --title "Combat Shadow Studio v$V (APK de test)" --notes "$NOTES"
          fi
