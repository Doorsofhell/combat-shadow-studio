# Test APK (debug-signed) for installing on a real phone. Never a Play Store build: the release
# AAB needs the private upload key, which stays off GitHub (docs/ANDROID.md).
name: APK de test Android

on:
  workflow_dispatch:
  push:
    branches: ['build/apk']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - name: APK de test
        run: npm run android:apk-test
      - name: Nom versionné
        id: name
        run: |
          V=$(node -p "require('./package.json').version")
          echo "file=combat-shadow-studio-v$V-test.apk" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "combat-shadow-studio-v$V-test.apk"
          sha256sum "combat-shadow-studio-v$V-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
      # the APK is also kept on its own branch so it can be fetched with plain git
      - name: Branche apk-builds
        run: |
          F=${{ steps.name.outputs.file }}
          mkdir /tmp/out && cp "$F" /tmp/out/ && cd /tmp/out
          git init -q -b apk-builds
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add "$F"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "APK de test $F (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
