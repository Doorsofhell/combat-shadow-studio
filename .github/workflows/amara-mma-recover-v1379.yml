name: Amara MMA - recover reviewed smooth underband candidate

on:
  push:
    branches:
      - prototype/amara-mma-compression-reference
    paths:
      - .github/workflows/amara-mma-recover-v1379.yml

permissions:
  actions: read
  contents: write

jobs:
  recover-checked-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: amara-mma-reference-v1379-prototype
          run-id: 43368631728
          github-token: ${{ github.token }}
          path: /tmp/mma-candidate
      - name: Install exact previously rendered and validated outfit into the experimental branch
        run: |
          set -euo pipefail
          find /tmp/mma-candidate -type f -printf '%p %s bytes\n'
          model=$(find /tmp/mma-candidate -type f -name mma.glb | head -1)
          test -s "$model"
          cp "$model" public/coaches/mma-amara/tenues/mma.glb
          mkdir -p captures/amara-mma-prototype
          for name in 01-garde-face.jpg 02-garde-dos.jpg 03-low-kick.jpg 04-high-kick.jpg 05-high-kick-profil.jpg 06-brassiere-profil.jpg planche-4-poses.jpg diagnostic.json; do
            f=$(find /tmp/mma-candidate -type f -name "$name" | head -1)
            test -s "$f" || { echo "MISSING $name"; exit 1; }
            cp "$f" "captures/amara-mma-prototype/$name"
          done
          python3 scripts/dev/validate-amara-mma-reference-v1379.py
          changed=$(git diff --name-only -- public/coaches)
          [[ -z "$changed" || "$changed" = "public/coaches/mma-amara/tenues/mma.glb" ]] || { echo "Unexpected changed models: $changed"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm two separately selectable photo sources and all 7 outfits
        run: |
          AMARA_AUDIT_STRICT=1 python3 scripts/dev/audit-amara-original-swimsuit.py
          npm run test -- src/three/__tests__/amara-photo-source-v1379.test.ts src/three/__tests__/amara-clean-surface-v1379.test.ts src/three/__tests__/outfit-amara-v1374.test.ts
          npm run build
          test -s dist/coaches/mma-amara/photo-clean.glb
      - name: Commit only the actual recovered MMA mesh and its 6 real WebGL images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/coaches/mma-amara/tenues/mma.glb captures/amara-mma-prototype/*.jpg captures/amara-mma-prototype/diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(v1.37.9): final 96-segment MMA bra band and approved boxer with six review poses [skip ci]"
            git fetch origin prototype/amara-mma-compression-reference
            git rebase origin/prototype/amara-mma-compression-reference
            git push origin HEAD:prototype/amara-mma-compression-reference
          fi
