name: v1.52 - Audit des maillages cou/nuque GLB

on:
  push:
    branches:
      - feature/neck-nape-v1520
    paths:
      - 'tools/generator/rocketbox/audit_neck_v1520.py'
      - '.github/workflows/neck-v1520-glb-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  glb-neck-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/neck-nape-v1520
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical geometry tooling
        run: python -m pip install numpy scipy pillow
      - name: Diagnose real shipped models
        run: |
          python tools/generator/rocketbox/audit_neck_v1520.py \
            public/coaches/mma-kadir/photo.glb \
            public/coaches/mma-amara/photo.glb \
            public/coaches/nael/photo.glb \
            public/coaches/inaya/photo.glb \
            public/coaches/victor/photo.glb
      - name: Commit audit data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/v1520/neck-glb-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(1.52): measured neck geometry report [skip ci]"
            git push origin HEAD:feature/neck-nape-v1520
          fi
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1520-neck-glb-audit
          path: captures/v1520/neck-glb-audit.json
          if-no-files-found: warn
