name: v1.38.0 - Amara, finition des tenues et du cou

on:
  pull_request:
    branches:
      - claude/project-thread-o7lrt8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amara-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Jonction du cou (une normale et un jeu de poids par point partagé)
        run: |
          pip install numpy
          python3 tools/generator/rocketbox/neck_seam.py public/coaches/mma-amara/photo-clean.glb
          python3 tools/generator/rocketbox/neck_seam.py public/coaches/mma-amara/photo.glb
      - name: Cou, bandes en mouvement, tenues, matières, autres coachs, version
        run: |
          npm run test -- src/three/__tests__/amara-finish-v1380.test.ts src/three/__tests__/outfit-amara-finish-v1379.test.ts src/three/__tests__/amara-photo-source-v1379.test.ts src/three/__tests__/outfit-amara-v1374.test.ts src/three/__tests__/outfit-assets-v1372.test.ts src/three/__tests__/outfit.test.ts src/three/__tests__/outfit-materials-v1371.test.ts src/three/__tests__/outfit-references-v1372.test.ts src/three/__tests__/outfit-rollback-v1373.test.ts src/three/__tests__/amara-skin-v1378.test.ts src/domain/release-version.test.ts src/boot/__tests__/preload.test.ts
      - name: TypeScript et build de production
        run: npm run build
