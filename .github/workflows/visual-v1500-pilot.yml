name: v1.50.0 - Pilot WebGL before-after validation

on:
  pull_request:
    branches:
      - claude/project-thread-o7lrt8
    paths-ignore:
      - 'captures/v1500/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout isolated 1.50.0 prototype
        uses: actions/checkout@v4
        with:
          ref: feature/streetfighter-visual-v1500
          persist-credentials: true
      - name: Checkout exact production 1.49.0 baseline
        uses: actions/checkout@v4
        with:
          ref: 74ec25031dc92668a58f0652201276449e9f6722
          path: reference-v1490
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies in both versions
        run: |
          npm ci
          npm ci --prefix reference-v1490
      - name: Run material and regression tests
        run: npm run test -- src/three/__tests__/premium-visual-v1490.test.ts src/three/__tests__/premium-skin-v1480.test.ts src/three/__tests__/amara-semi-realiste-v1471.test.ts
      - name: Build experimental application (no deployment)
        run: npm run build
      - name: Prepare browser with SwiftShader
        run: npx playwright install --with-deps chromium
      - name: Capture Amara/Victor in real WebGL
        run: node scripts/visuels/v1500-before-after.mjs
      - name: Upload real PNG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1500-real-pilot-before-after
          path: captures/v1500/
          if-no-files-found: warn
      - name: Commit direct preview images to prototype branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/v1500/
          if ! git diff --cached --quiet; then
            git commit -m "test(v1.50): real Amara/Victor before-after images [skip ci]"
            git push origin HEAD:feature/streetfighter-visual-v1500
          fi
