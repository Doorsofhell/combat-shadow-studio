name: Validate natural MMA crotch against seven Blender garment gates
on:
  push:
    branches: [prototype/amara-mma-natural-groin-v1379]
    paths: [.github/workflows/amara-natural-groin-geometry.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Check 7 outfits, zero shorts bridge, lisse bra
        run: blender --background --threads 2 --python-exit-code 42 --python scripts/dev/check-amara-garments-v1377.py
      - run: python3 scripts/dev/validate-amara-mma-reference-v1379.py
      - run: AMARA_AUDIT_STRICT=1 python3 scripts/dev/audit-amara-original-swimsuit.py
