# Version de publication Google Play (v2.3.1) : AAB signé avec la clé d'importation + APK signé pour les essais.
# La clé ne vit QUE dans les secrets GitHub du dépôt (jamais dans le code) :
#   ANDROID_KEYSTORE_BASE64  le fichier .jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sans ces secrets, le workflow produit quand même les fichiers, marqués NON-SIGNE (contrôle de la compilation), et
# le résumé l'indique : ils ne peuvent pas être envoyés au Play Store. Voir docs/PLAY_STORE.md.
name: Version Play Store Android

on:
  workflow_dispatch:
  push:
    branches: ['release/play-store', 'claude/project-thread-6v801a']
    paths:
      - package.json
      - android/**
      - capacitor.config.ts
      - scripts/android/**
      - scripts/android-version.mjs
      - .github/workflows/android-release.yml

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - run: npm ci

      # Les tests unitaires sont lancés et leur résultat est joint au rapport. Ils ne bloquent pas la compilation :
      # la 2.3.0 a 4 échecs connus, écrits au journal (fluidity x2, hooks-biomeca, taille du modèle d'Amara).
      - name: Tests unitaires (résultat dans le rapport)
        continue-on-error: true
        run: npx vitest run --reporter=default 2>&1 | tee vitest.log; exit ${PIPESTATUS[0]}

      - name: Clé d'importation (secrets GitHub)
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # secrets créés par Youssef le 20/11/2026 sous d'autres noms : reconnus par leur contenu
          CANDIDATE_1: ${{ secrets.PERE_MERE }}
          CANDIDATE_2: ${{ secrets.TOWN }}
          CANDIDATE_3: ${{ secrets.POKEMON }}
          CANDIDATE_4: ${{ secrets.SAHABA }}
        run: bash scripts/android/setup-signing.sh

      - name: Build web + AAB + APK de publication
        run: npm run build:android && cd android && ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Contrôles Play Store
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
        run: bash scripts/android/verify-release.sh

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/keystore.properties

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-store-${{ steps.key.outputs.signed == '1' && 'signe' || 'NON-SIGNE' }}
          path: out-release/
          retention-days: 30
