name: Amara v1.37.9 split original and clean body safely

on:
  push:
    branches: [prototype/amara-mma-compression-reference]
    paths:
      - .github/workflows/amara-split-photo-assets-v1379.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Move verified cleaned model to outfit-only path; restore exact original model
        run: |
          set -euo pipefail
          test ! -e public/coaches/mma-amara/photo-clean.glb
          cp public/coaches/mma-amara/photo.glb public/coaches/mma-amara/photo-clean.glb
          git fetch origin claude/project-thread-o7lrt8
          git show FETCH_HEAD:public/coaches/mma-amara/photo.glb > public/coaches/mma-amara/photo.glb
          test -s public/coaches/mma-amara/photo-clean.glb
          python scripts/dev/validate-amara-clean-morph-v1379.py public/coaches/mma-amara/photo.glb public/coaches/mma-amara/photo-clean.glb
          test "$(git hash-object public/coaches/mma-amara/photo.glb)" = "805f138cd71a5091136a50f52e2a8ccb43f63f46"
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test source-selection and build both assets
        run: |
          npm run build
          test -s dist/coaches/mma-amara/photo.glb
          test -s dist/coaches/mma-amara/photo-clean.glb
      - name: Save only the isolated original/clean Amara pair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coaches/mma-amara/photo.glb public/coaches/mma-amara/photo-clean.glb
          git commit -m "assets(v1.37.9): keep Amara original undressed, clean skin only with outfits [skip ci]"
          git fetch origin prototype/amara-mma-compression-reference
          git rebase origin/prototype/amara-mma-compression-reference
          git push origin HEAD:prototype/amara-mma-compression-reference
