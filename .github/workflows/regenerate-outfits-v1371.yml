name: Tenues 1.37.2 - Régénérer et publier les GLB

on:
  push:
    branches:
      - claude/project-thread-o7lrt8
    paths:
      - tools/generator/rocketbox/outfits.py
      - scripts/dev/regenerate-outfits-v1371.sh
      - .github/workflows/regenerate-outfits-v1371.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: claude/project-thread-o7lrt8
      - name: Install Blender and glTF Python dependencies
        run: |
          sudo apt-get update
          # Ubuntu's distro Blender 5.0.1 does not necessarily depend on NumPy,
          # but the bundled io_scene_gltf2 import/export add-on requires it.
          sudo apt-get install -y blender fonts-inter python3-numpy

      - name: Verify NumPy inside Blender before loading coach models
        run: |
          blender --version | head -n 2
          blender --background --python-exit-code 42 --python-expr "import sys, numpy; print('Blender Python:', sys.version); print('NumPy:', numpy.__version__, numpy.__file__)"
      - name: Blender environment and Python syntax
        run: |
          blender --version | head -n 2
          python3 -m py_compile tools/generator/rocketbox/outfits.py scripts/dev/validate-outfit-build-v1372.py

      - name: Regenerate reference-aligned MMA outfits
        run: bash scripts/dev/regenerate-outfits-v1371.sh
      - name: Publish Blender diagnostic logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-v1372-generation-logs
          path: logs/outfits-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify all outfits and preserved reference models
        run: npm run test -- src/three/__tests__/outfit-assets-v1372.test.ts src/three/__tests__/outfit.test.ts src/three/__tests__/outfit-v032.test.ts src/three/__tests__/outfit-materials-v1371.test.ts
      - name: Build application with freshly regenerated GLBs
        run: npm run build
        env:
          # v0.37 comptes : configuration web publique du projet Firebase « Combat Shadow Studio » (forfait Spark).
          # Ce sont des identifiants publics (présents dans toute application web Firebase), pas des secrets :
          # l'accès est protégé par Firebase Authentication et les règles Firestore (firestore.rules).
          VITE_FIREBASE_API_KEY: AIzaSyDBWzZTC4QHV445rRtbrJ-fLJLfUWCujV8
          VITE_FIREBASE_AUTH_DOMAIN: combat-shadow-studio.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: combat-shadow-studio
          VITE_FIREBASE_APP_ID: 1:48532638871:web:2f135f723753e52b2cedd2

      - name: Commit only validated GLBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/coaches/*/tenues/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets(outfits): regenerate 28 v1.37.2 garments after quality checks"
            git push origin HEAD:claude/project-thread-o7lrt8
          else
            echo "GLB inchangés"
          fi

      # A GITHUB_TOKEN push does NOT trigger preview.yml. Deploy here instead,
      # otherwise the site would keep the old models even after GitHub receives the GLBs.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload freshly built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy regenerated assets to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
