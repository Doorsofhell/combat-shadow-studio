name: Tenues 1.37.3 - Restaurer Kadir et publier

on:
  push:
    branches:
      - claude/project-thread-o7lrt8
    paths:
      - package.json
      - scripts/dev/restore-kadir-v1373.sh
      - .github/workflows/regenerate-outfits-v1371.yml
      - src/domain/releases.ts
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: claude/project-thread-o7lrt8
      - name: Restore seven approved Kadir v1.37.0 outfits
        run: bash scripts/dev/restore-kadir-v1373.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate boot asset size manifest
        run: node scripts/boot-sizes.mjs
      - name: Verify old Kadir geometry and all other garment tests
        run: npm run test -- src/three/__tests__/outfit-rollback-v1373.test.ts src/domain/release-version.test.ts src/three/__tests__/outfit-assets-v1372.test.ts src/three/__tests__/outfit-references-v1372.test.ts src/three/__tests__/outfit.test.ts src/three/__tests__/outfit-v032.test.ts src/three/__tests__/outfit-materials-v1371.test.ts src/boot/__tests__/preload.test.ts
      - name: Build v1.37.3 with fingerprinted original Kadir models
        run: npm run build
        env:
          # v0.37 comptes : configuration web publique du projet Firebase « Combat Shadow Studio » (forfait Spark).
          # Ce sont des identifiants publics (présents dans toute application web Firebase), pas des secrets :
          # l'accès est protégé par Firebase Authentication et les règles Firestore (firestore.rules).
          VITE_FIREBASE_API_KEY: AIzaSyDBWzZTC4QHV445rRtbrJ-fLJLfUWCujV8
          VITE_FIREBASE_AUTH_DOMAIN: combat-shadow-studio.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: combat-shadow-studio
          VITE_FIREBASE_APP_ID: 1:48532638871:web:2f135f723753e52b2cedd2

      - name: Commit approved Kadir GLBs and refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/coaches/mma-kadir/tenues/*.glb src/boot/assetSizes.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(v1.37.3): restore seven non-regressing Kadir GLBs"
            git push origin HEAD:claude/project-thread-o7lrt8
          else
            echo "GLB inchangés"
          fi

      # A GITHUB_TOKEN push does NOT trigger preview.yml. Deploy here instead,
      # otherwise the site would keep the old models even after GitHub receives the GLBs.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload freshly built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy verified 1.37.3 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
