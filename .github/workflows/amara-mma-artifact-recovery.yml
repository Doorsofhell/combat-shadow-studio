name: Amara MMA - recover already-rendered prototype artifacts

on:
  push:
    branches:
      - prototype/amara-mma-compression-reference
    paths:
      - .github/workflows/amara-mma-artifact-recovery.yml

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download the six accepted real images and MMA GLB (no Blender rerun)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/amara-deliverables
          gh run download 43326229600 --repo Doorsofhell/combat-shadow-studio --name amara-mma-reference-v1379-prototype --dir /tmp/amara-deliverables
          find /tmp/amara-deliverables -type f -printf '%p %s bytes\n'
          glb=$(find /tmp/amara-deliverables -type f -name mma.glb | head -1)
          test -s "$glb"
          cp "$glb" public/coaches/mma-amara/tenues/mma.glb
          mkdir -p captures/amara-mma-prototype
          for name in 01-garde-face.jpg 02-garde-dos.jpg 03-low-kick.jpg 04-high-kick.jpg 05-high-kick-profil.jpg 06-brassiere-profil.jpg planche-4-poses.jpg diagnostic.json; do
            src=$(find /tmp/amara-deliverables -type f -name "$name" | head -1)
            test -s "$src" || { echo "Missing capture $name"; exit 1; }
            cp "$src" "captures/amara-mma-prototype/$name"
          done
      - name: Validate actual GLB and ensure only MMA source assets changed
        run: |
          python3 scripts/dev/validate-amara-mma-reference-v1379.py
          changed=$(git diff --name-only -- public/coaches)
          test "$changed" = "public/coaches/mma-amara/tenues/mma.glb" || { echo "Unexpected model modifications: $changed"; exit 1; }
      - name: Commit only the isolated garment and proof images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coaches/mma-amara/tenues/mma.glb captures/amara-mma-prototype/*.jpg captures/amara-mma-prototype/diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(prototype): accepted Amara MMA reference cut and comparison captures [skip ci]"
            git push origin HEAD:prototype/amara-mma-compression-reference
          fi
