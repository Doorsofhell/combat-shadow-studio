name: Amara MMA - internal image review

on:
  push:
    branches:
      - prototype/amara-mma-compression-reference
    paths:
      - .github/workflows/amara-prototype-internal-review.yml
      - captures/amara-mma-prototype/*.jpg

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare preview encodings for garment visual inspection
        run: |
          test -s captures/amara-mma-prototype/planche-4-poses.jpg
          mkdir -p captures/amara-mma-prototype/_internal-review
          base64 -w0 captures/amara-mma-prototype/planche-4-poses.jpg > captures/amara-mma-prototype/_internal-review/planche.b64
          base64 -w0 captures/amara-mma-prototype/06-brassiere-profil.jpg > captures/amara-mma-prototype/_internal-review/brassiere.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/amara-mma-prototype/_internal-review/
          if ! git diff --cached --quiet; then
            git commit -m "review(prototype): temporary encoded screenshots [skip ci]"
            git push origin HEAD:prototype/amara-mma-compression-reference
          fi
