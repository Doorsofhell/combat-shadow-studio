name: Diagnose Amara high-kick ragged MMA groin by 3D ray picking
on:
  push:
    branches: [prototype/amara-mma-compression-reference]
    paths: [.github/workflows/amara-highkick-ray-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/vite.log 2>&1 &
          for n in $(seq 1 40);do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0;sleep 1;done
          exit 1
      - run: node scripts/dev/probe-amara-mma-highkick-v1379.mjs
