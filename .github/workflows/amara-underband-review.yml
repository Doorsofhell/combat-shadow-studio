name: Inspect Amara final elastic band from real GLB captures

on:
  push:
    branches:
      - prototype/amara-mma-compression-reference
    paths:
      - .github/workflows/amara-underband-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Save tiny review-only text encoded closeups
        run: |
          mkdir -p captures/amara-mma-prototype/_internal-review
          test -s captures/amara-mma-prototype/06-brassiere-profil.jpg
          test -s captures/amara-mma-prototype/planche-4-poses.jpg
          base64 -w0 captures/amara-mma-prototype/06-brassiere-profil.jpg > captures/amara-mma-prototype/_internal-review/underband.b64
          base64 -w0 captures/amara-mma-prototype/planche-4-poses.jpg > captures/amara-mma-prototype/_internal-review/poses.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captures/amara-mma-prototype/_internal-review/
          if ! git diff --cached --quiet; then
            git commit -m "review: verified MMA band closeup [skip ci]"
            git fetch origin prototype/amara-mma-compression-reference
            git rebase origin/prototype/amara-mma-compression-reference
            git push origin HEAD:prototype/amara-mma-compression-reference
          fi
