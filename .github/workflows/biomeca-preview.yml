# Experimental only: no deployment, no GitHub Release, no overwrite of APK branches.
name: Vérification Biomécanique (test)
on:
  push:
    branches:
      - experiment/biomeca-selector-v046
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android-preview:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Construire l'APK de démonstration sans déployer
        run: npm run build:android && cd android && ./gradlew assembleDebug
      - name: Préparer l'APK expérimental
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk combat-shadow-studio-biomeca-test.apk
          sha256sum combat-shadow-studio-biomeca-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: combat-shadow-studio-biomeca-test-apk
          path: combat-shadow-studio-biomeca-test.apk
          retention-days: 14
