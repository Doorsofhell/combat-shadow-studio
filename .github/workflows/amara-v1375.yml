name: Tenues 1.37.5 - Nettoyer le torse et les finitions d'Amara

on:
  push:
    branches:
      - claude/project-thread-o7lrt8
    paths:
      - package.json
      - tools/generator/rocketbox/outfits.py
      - scripts/dev/clean-amara-skin-v1375.py
      - scripts/dev/regenerate-amara-v1375.sh
      - .github/workflows/amara-v1375.yml
      - src/domain/releases.ts
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  repair-amara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout active branch with binary reference assets
        uses: actions/checkout@v4
        with:
          ref: claude/project-thread-o7lrt8
          persist-credentials: true
          fetch-depth: 0

      - name: Install Blender and numerical image utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y blender fonts-inter python3-numpy python3-pil python3-scipy
          blender --background --python-exit-code 42 --python-expr "import numpy, scipy, PIL; print('image tools available')"

      - name: Verify repair scripts compile
        run: |
          python3 -m py_compile scripts/dev/clean-amara-skin-v1375.py tools/generator/rocketbox/outfits.py

      - name: Repair Amara's baked-in bikini texture without touching the rig
        run: |
          set -o pipefail
          mkdir -p logs
          blender --background --threads 2 --python-exit-code 42 --python scripts/dev/clean-amara-skin-v1375.py 2>&1 | tee logs/amara-skin-v1375.log

      - name: Rebuild Amara's seven outfits from the cleaned body
        run: bash scripts/dev/regenerate-amara-v1375.sh

      - name: Keep Blender and skin repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amara-1375-repair-logs
          path: |
            logs/amara-skin-v1375.log
            logs/amara-v1375.log
          if-no-files-found: warn
          retention-days: 14

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh model cache and sizes
        run: node scripts/boot-sizes.mjs

      - name: Validate repaired body, seven outfits, other coaches and release version
        run: |
          npm run test -- src/three/__tests__/amara-skin-v1375.test.ts src/three/__tests__/outfit-amara-v1374.test.ts src/three/__tests__/outfit-assets-v1372.test.ts src/three/__tests__/outfit-references-v1372.test.ts src/three/__tests__/outfit-rollback-v1373.test.ts src/three/__tests__/outfit.test.ts src/three/__tests__/outfit-v032.test.ts src/three/__tests__/outfit-materials-v1371.test.ts src/domain/release-version.test.ts src/boot/__tests__/preload.test.ts

      - name: Load public site configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            val=$(grep -E "^[[:space:]]+${key}:" .github/workflows/preview.yml | head -1 | sed -E "s/^[[:space:]]+${key}:[[:space:]]*//")
            test -n "$val" || { echo "::error::Public configuration missing: $key"; exit 1; }
            echo "$key=$val" >> "$GITHUB_ENV"
          done

      - name: Build complete 1.37.5 site with repaired assets
        run: npm run build

      - name: Commit only verified Amara photo, outfits and size manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/coaches/mma-amara/photo.glb public/coaches/mma-amara/tenues/*.glb src/boot/assetSizes.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(v1.37.5): clean Amara bikini paint and rebuild seven outfits"
            git push origin HEAD:claude/project-thread-o7lrt8
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy version 1.37.5
        uses: actions/deploy-pages@v4
        id: deployment
