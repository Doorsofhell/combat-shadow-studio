<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat Shadow Studio — Navigation dynamique (référence)</title>
<style>
:root{color-scheme:dark;--bg:#111318;--card:#191c23;--panel:#252933;--text:#f5f5f7;--muted:#a3a9b6;--line:#343945;--red:#e43d43}
*{box-sizing:border-box}body{margin:0;background:#0c0e12;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
.phone{width:min(100%,390px);height:620px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;position:relative}.top{padding:17px 17px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{font-size:11px;letter-spacing:2px;font-weight:800}.logo b{color:var(--red)}.ver{font-size:10px;color:var(--muted)}.content{flex:1;min-height:0;overflow:auto;padding:20px 18px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:800}h2{font-size:25px;letter-spacing:-.7px;margin:8px 0}.desc{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 15px}.stage{height:170px;border:1px solid var(--line);border-radius:15px;background:radial-gradient(ellipse at center,var(--panel),var(--card));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;margin:12px 0}.figure{font-size:76px;line-height:1;filter:grayscale(.6)}.stage span{font-size:10px;letter-spacing:1.5px;color:var(--muted)}.tile{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:9px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.pill{font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:20px;padding:4px 8px}
.bottom{border-top:1px solid var(--line);padding:10px 8px 15px;background:var(--card);z-index:3}.bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.navbtn{border:0;background:transparent;color:var(--muted);min-width:0;min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:10px;cursor:pointer;position:relative;transition:background .18s,color .18s,transform .18s}.navbtn:active{transform:scale(.9)}.navbtn.active{color:var(--red);background:var(--panel)}svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.navbtn small{font-size:9px;white-space:nowrap;font-weight:600}.dot{position:absolute;top:4px;right:17px;width:7px;height:7px;border-radius:50%;background:var(--red)}.changing{animation:swap .26s ease both}@keyframes swap{from{opacity:.2;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.scrim{position:absolute;inset:0;background:#0008;z-index:9}.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;z-index:10;padding:12px 17px 22px;box-shadow:0 -12px 35px #0002;animation:sheetin .22s ease both}@keyframes sheetin{from{transform:translateY(100%)}to{transform:translateY(0)}}.handle{height:4px;width:36px;background:var(--muted);opacity:.4;border-radius:5px;margin:0 auto 16px}.sheettitle{font-weight:800;font-size:16px;margin-bottom:12px}.menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.menuitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 3px;color:var(--text);display:flex;align-items:center;flex-direction:column;gap:7px;cursor:pointer;font-size:10px;position:relative}.menuitem.highlight{border-color:var(--red)}.version{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:10px}.version b{font-size:13px}.version p{font-size:11px;color:var(--muted);line-height:1.6;margin:7px 0 0}.actions{display:flex;gap:8px;margin-top:12px}.action{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:10px 12px;font-size:11px;cursor:pointer}.action.primary{background:var(--red);color:white;border-color:var(--red)}.hint{font-size:11px;color:var(--muted);text-align:center;max-width:390px}@media(prefers-reduced-motion:reduce){.changing,.sheet{animation:none}}
</style></head><body>
<div class="phone"><header class="top"><div class="logo">COMBAT <b>SHADOW</b> STUDIO</div><div class="ver">NAVIGATION CONCEPT</div></header><main class="content" id="content" aria-live="polite"></main><nav class="bottom" aria-label="Navigation contextuelle"><div class="bar" id="bar"></div></nav><div id="overlay"></div></div>
<div class="actions"><button class="action primary" id="auto">▶ Démonstration auto</button><button class="action" id="reset">Recommencer</button></div><div class="hint" id="hint">Appuie sur les icônes de la barre pour tester.</div>
<script>
/* Source fonctionnelle de référence — ne pas intégrer telle quelle à l'application React sans adaptation. */
const icons={"home":"<path d=\"m3 10 9-7 9 7v11H3z\"/><path d=\"M9 21v-7h6v7\"/>","dumbbell":"<path d=\"m6.5 6.5 11 11M3 8l5-5M16 21l5-5M2 11l9-9M13 22l9-9\"/>","layers":"<path d=\"m12 2 9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5\"/>","chart":"<path d=\"M4 20V11M10 20V5M16 20v-9M22 20H2\"/>","star":"<path d=\"m12 2 3.1 6.3 7 .9-5 4.9 1.2 7-6.3-3.3-6.3 3.3 1.2-7-5-4.9 7-.9z\"/>","grid":"<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>","back":"<path d=\"m15 18-6-6 6-6\"/>","play":"<path d=\"m8 5 12 7-12 7z\"/>","pause":"<path d=\"M8 5v14M16 5v14\"/>","camera":"<path d=\"M3 7h4l2-3h6l2 3h4v13H3z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/>","speed":"<path d=\"M4 17a9 9 0 1 1 16 0M12 13l5-5\"/><circle cx=\"12\" cy=\"17\" r=\"1\"/>","scan":"<path d=\"M8 3H4v4M16 3h4v4M4 17v4h4M20 17v4h-4\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/>","heart":"<path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z\"/>","search":"<circle cx=\"10.5\" cy=\"10.5\" r=\"7\"/><path d=\"m16 16 5 5\"/>","filter":"<path d=\"M3 5h18M7 12h10M10 19h4\"/>","calendar":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v4M17 3v4M3 10h18\"/>","history":"<path d=\"M3 12a9 9 0 1 1 3 7M3 17v-5h5M12 7v5l4 2\"/>","user":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>","settings":"<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"/>","sparkle":"<path d=\"m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z\"/>","check":"<path d=\"m4 12 5 5L20 6\"/>","options":"<path d=\"M4 6h16M4 12h16M4 18h16\"/>","coach":"<circle cx=\"9\" cy=\"7\" r=\"3\"/><path d=\"M3 19v-3a6 6 0 0 1 12 0v3M17 8h5M19.5 5.5v5\"/>"};
const svg=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[k]||icons.grid)+'</svg>';
const titles={home:'Accueil',train:'Entraînement',tech:'Techniques',detail:'Fiche technique',progress:'Progrès',legends:'Légendes',legenddetail:'Fiche légende',profile:'Mon profil',settings:'Paramètres'};
const descriptions={home:'Votre espace de coaching. Toutes les fonctions sont accessibles depuis la barre inférieure.',train:'Les commandes deviennent celles de la séance. Aucun bouton flottant.',tech:'Recherche, filtres et sélection d’une technique.',detail:'Les commandes de la fiche remplacent celles du catalogue.',progress:'Périodes, statistiques et historique au bout du pouce.',legends:'Recherche et exploration des combattants de légende.',legenddetail:'Parcours et techniques de la légende sélectionnée.',profile:'Votre profil est accessible sans remonter en haut.',settings:'Les réglages restent disponibles depuis n’importe quel écran.'};
const $=id=>document.getElementById(id);let screen='home',stack=[],sheet=null,playing=false,seen=false,auto=false,runId=0;
function nav(s){if(s!==screen){stack.push(screen);screen=s}sheet=null;render()}
function back(){screen=stack.pop()||'home';sheet=null;render()}
function actions(){switch(screen){
case 'home':return [['dumbbell','Entraîner','train'],['layers','Techniques','tech'],['chart','Progrès','progress'],['user','Profil','profile'],['grid','Menu','menu']];
case 'train':return [['back','Retour','back'],[playing?'pause':'play',playing?'Pause':'Démarrer','toggle'],['scan','Décomposer','detail'],['camera','Caméra','camera'],['grid','Menu','menu']];
case 'tech':return [['back','Retour','back'],['search','Rechercher','search'],['filter','Filtres','filters'],['play','Technique','detail'],['grid','Menu','menu']];
case 'detail':return [['back','Retour','back'],['play',"S'entraîner",'train'],['speed','Ralenti','speed'],['check','Maîtrise','mastery'],['grid','Menu','menu']];
case 'progress':return [['back','Retour','back'],['calendar','Période','period'],['chart','Statistiques','stats'],['history','Historique','history'],['grid','Menu','menu']];
case 'legends':return [['back','Retour','back'],['search','Rechercher','search'],['filter','Disciplines','filters'],['star','Légende','legenddetail'],['grid','Menu','menu']];
case 'legenddetail':return [['back','Retour','back'],['history','Parcours','history'],['dumbbell','Techniques','tech'],['heart','Favoris','fav'],['grid','Menu','menu']];
case 'profile':return [['back','Retour','back'],['chart','Activité','progress'],['coach','Coach','coach'],['settings','Réglages','settings'],['grid','Menu','menu']];
default:return [['back','Retour','back'],['user','Profil','profile'],['options','Affichage','display'],['camera','Caméra','camera'],['grid','Menu','menu']];}}
function sheetBody(){if(sheet==='menu'){const items=[['home','Accueil','home'],['dumbbell','Entraîner','train'],['layers','Techniques','tech'],['chart','Progrès','progress'],['star','Légendes','legends'],['user','Profil','profile'],['settings','Paramètres','settings'],['sparkle','Nouveautés','news']];return '<div class="menugrid">'+items.map(([i,l,a])=>'<button class="menuitem '+(a==='news'?'highlight':'')+'" data-go="'+a+'">'+svg(i)+'<span>'+l+'</span>'+(a==='news'&&!seen?'<i class="dot"></i>':'')+'</button>').join('')+'</div>'}
if(sheet==='news')return '<div class="version"><b>Version 0.32.0 — Démonstration fictive</b><p>🥊 Nouvelles techniques<br>🥋 Nouvelles disciplines<br>✨ Améliorations de l’interface<br>🛠 Corrections de stabilité</p></div><div class="version"><b>Historique des versions</b><p>Les versions publiées apparaîtront ici.</p></div><div class="actions"><button class="action primary" data-close>Fermer</button></div>';
return '<p class="desc">Cette commande ouvrirait ici son panneau dédié, sans changer de page ni ajouter de barre flottante.</p><div class="actions"><button class="action primary" data-close>Fermer</button></div>'}
function render(){let h='<div class="eyebrow">COMBAT SHADOW STUDIO</div><h2>'+titles[screen]+'</h2><p class="desc">'+descriptions[screen]+'</p>';
if(['train','detail'].includes(screen))h+='<div class="stage"><div class="figure">🥊</div><span>APERÇU SYMBOLIQUE DU COACH 3D</span></div><div class="tile"><strong>'+(playing?'Séance en cours':'Prêt à commencer')+'</strong><span class="pill">'+(playing?'LECTURE':'PRÊT')+'</span></div>';
else if(screen==='home')h+='<div class="stage"><div class="figure">🥋</div><span>ESPACE COACHING PREMIUM</span></div><div class="tile"><strong>Votre prochaine séance</strong><span class="pill">BOXE</span></div>';
else if(screen==='progress')h+='<div class="tile"><strong>Temps d’entraînement</strong><span>04 h 20 (démo)</span></div><div class="tile"><strong>Techniques pratiquées</strong><span>18 (démo)</span></div><div class="tile"><strong>Progression</strong><span class="pill">+12 % (démo)</span></div>';
else if(screen==='tech')h+='<div class="tile"><strong>Jab</strong><span>Boxe anglaise</span></div><div class="tile"><strong>Direct arrière</strong><span>Boxe anglaise</span></div><div class="tile"><strong>Crochet gauche</strong><span>Boxe anglaise</span></div>';
else if(screen==='legends')h+='<div class="tile"><strong>Boxe anglaise</strong><span>Champions</span></div><div class="tile"><strong>Muay-thaï</strong><span>Champions</span></div><div class="tile"><strong>Judo</strong><span>Champions</span></div>';
else if(screen==='profile')h+='<div class="stage"><div class="figure">👤</div><span>VOTRE PROFIL</span></div>';
else if(screen==='settings')h+='<div class="tile"><strong>Apparence</strong><span>Automatique</span></div><div class="tile"><strong>Audio</strong><span>Activé</span></div><div class="tile"><strong>Qualité 3D</strong><span>Adaptative</span></div>';
else h+='<div class="tile"><strong>Informations</strong><span>Contenu de démonstration</span></div>';
$('content').innerHTML=h;const b=$('bar');b.classList.remove('changing');void b.offsetWidth;b.classList.add('changing');
b.innerHTML=actions().map(([ic,l,a])=>'<button class="navbtn '+(a==='toggle'&&playing?'active':'')+'" data-act="'+a+'" aria-label="'+l+'">'+svg(ic)+'<small>'+l+'</small>'+(a==='menu'&&!seen?'<i class="dot"></i>':'')+'</button>').join('');
b.querySelectorAll('button').forEach(x=>x.onclick=()=>act(x.dataset.act));
$('overlay').innerHTML=sheet?'<div class="scrim" id="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="'+(sheet==='menu'?'Navigation générale':sheet==='news'?'Nouveautés':'Action contextuelle')+'"><div class="handle"></div><div class="sheettitle">'+(sheet==='menu'?'Navigation générale':sheet==='news'?'Nouveautés':'Action contextuelle')+'</div>'+sheetBody()+'</section>':'';
const scrim=$('scrim');if(scrim)scrim.onclick=()=>{sheet=null;render()};
$('overlay').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{if(x.dataset.go==='news'){seen=true;sheet='news';render()}else nav(x.dataset.go)});
$('overlay').querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>{sheet=null;render()});}
function act(a){if(a==='menu'){sheet='menu';render()}else if(a==='back')back();else if(a==='toggle'){playing=!playing;render()}else if(titles[a])nav(a);else{sheet=a;render()}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('auto').onclick=async()=>{if(auto)return;auto=true;const id=++runId;const steps=[['Accueil',()=>{screen='home';stack=[];sheet=null;render()}],['Ouverture de la navigation générale',()=>act('menu')],['Accès aux nouveautés',()=>{seen=true;sheet='news';render()}],['Passage à Entraîner',()=>nav('train')],['Démarrage de la séance',()=>{playing=true;render()}],['Ouverture d’une fiche technique',()=>nav('detail')],['Retour intelligent',()=>back()],['Passage à Progrès',()=>nav('progress')],['Navigation vers Légendes',()=>nav('legends')]];for(const [label,fn] of steps){if(id!==runId)break;$('hint').textContent='▶ '+label;fn();await wait(1350)}auto=false;$('hint').textContent='Démonstration terminée. Tu peux maintenant tester les icônes.'};
$('reset').onclick=()=>{runId++;auto=false;screen='home';stack=[];sheet=null;playing=false;seen=false;render();$('hint').textContent='Appuie sur les icônes de la barre pour tester.'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render()}});render();
</script></body></html>
