<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Three.js et Babylon</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1f; --muted: #5b5b60; --line: #d6d6d6; --panel: #ffffff; --accent: #b3141c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141416; --fg: #f1f1f3; --muted: #a6a6ad; --line: #34343a; --panel: #1d1d21; --accent: #ff5a5f; } }
  :root[data-theme="dark"] { --bg: #141416; --fg: #f1f1f3; --muted: #a6a6ad; --line: #34343a; --panel: #1d1d21; --accent: #ff5a5f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 14px 16px 6px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); min-height: 36px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 16px 18px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-width: 0; }
  figcaption { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  figcaption span { font-weight: 400; color: var(--muted); font-size: 12px; }
  iframe { width: 100%; aspect-ratio: 9 / 14; border: 0; border-radius: 8px; background: #fff; display: block; }
  @media (max-width: 520px) { main { gap: 6px; } figure { padding: 5px; } }
</style>
</head>
<body>
<header>
  <h1>Même coach, même animation, deux moteurs</h1>
  <p>Gauche : Three.js (moteur actuel de l’application). Droite : Babylon 9.31. Les deux pages calculent exactement les mêmes positions d’os ; seul le rendu change. Rendu « réaliste » de comparaison, pas le style Encre de l’application.</p>
</header>
<form id="f">
  <label>Coach <select name="coach"><option value="homme">Homme</option><option value="femme">Femme</option></select></label>
  <label>Animation <select name="s">
    <option value="garde">Garde</option><option value="jab">Jab</option><option value="direct">Direct</option>
    <option value="crochet-avant">Crochet gauche</option><option value="uppercut-arriere">Uppercut droit</option>
    <option value="pivot-droite">Pivot</option><option value="combo" selected>Enchaînement jab, direct, crochet</option>
  </select></label>
  <label>Qualité <select name="q"><option value="haute">Haute</option><option value="basse">Basse</option></select></label>
</form>
<main>
  <figure><figcaption>Three.js <span>(actuel)</span></figcaption><iframe id="a" title="Rendu Three.js"></iframe></figure>
  <figure><figcaption>Babylon <span>(essai)</span></figcaption><iframe id="b" title="Rendu Babylon"></iframe></figure>
</main>
<script>
  const f = document.getElementById('f');
  function load() {
    const q = new URLSearchParams(new FormData(f));
    q.set('w', '450'); q.set('h', '700');
    document.getElementById('a').src = './three.html?' + q;
    document.getElementById('b').src = './babylon.html?' + q;
  }
  f.addEventListener('change', load);
  load();
</script>
</body>
</html>
